<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/logo.svg" />
  <title>MP3 Downloader</title>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="pantalla">
    <section class="hero">
      <canvas id="escena" aria-hidden="true"></canvas>
      <div class="hero-text">
        <h1 class="titulo"><span class="split">MP3 Downloader</span></h1>
        <p class="rota">
          Descarga tu
          <span class="rota-ventana"><span id="palabra" class="palabra">música</span></span>
        </p>
        <ul class="chips">
          <li>320 kbps</li>
          <li>Varios enlaces</li>
          <li>Sin registro</li>
        </ul>
      </div>
    </section>

    <main class="panel">
      <div class="card">
        <section class="group-header">
          <h2>Tus enlaces</h2>
          <span id="contador" class="contador">0 de 0</span>
        </section>

        <ul id="lista" class="list"></ul>

        <button id="btn-agregar" class="row-button" type="button">
          <span class="plus">+</span> Agregar enlace
        </button>

        <div class="actions">
          <button id="btn-descargar" class="btn primary" type="button">Descargar todo</button>
          <button id="btn-limpiar" class="btn secondary" type="button">Limpiar</button>
        </div>

        <p class="footnote">YouTube y otras plataformas compatibles. El audio se guarda en MP3.</p>
      </div>
    </main>
  </div>

  <div id="estado" class="status" aria-live="polite"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
